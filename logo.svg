<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="lpBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8F1E8"/><stop offset=".55" stop-color="#F1E4D6"/><stop offset="1" stop-color="#E7D3C2"/></linearGradient>
    <radialGradient id="lpSaucer" cx="45%" cy="40%" r="62%"><stop offset="0" stop-color="#FFFCF7"/><stop offset=".78" stop-color="#F6EEE4"/><stop offset="1" stop-color="#E6D6C6"/></radialGradient>
    <radialGradient id="lpCup" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".7" stop-color="#F9F3EB"/><stop offset="1" stop-color="#E9DCCD"/></radialGradient>
    <radialGradient id="lpEsp" cx="42%" cy="38%" r="70%"><stop offset="0" stop-color="#9A6A50"/><stop offset=".55" stop-color="#7A4D3A"/><stop offset="1" stop-color="#4E2F24"/></radialGradient>
    <linearGradient id="lpRose" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D9A493"/><stop offset=".5" stop-color="#B9776B"/><stop offset="1" stop-color="#C98F7C"/></linearGradient>
    <linearGradient id="lpSpoon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EDE4DA"/><stop offset=".5" stop-color="#B9ABA0"/><stop offset="1" stop-color="#D8CCC1"/></linearGradient>
    <filter id="lpGrain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .18  0 0 0 .06 0"/></filter>
    <filter id="lpSoft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="lpBlur2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <path id="lpHeart" d="M240 318c-10-8-58-36-58-72 0-20 15-34 33-34 11 0 20 6 25 14 5-8 14-14 25-14 18 0 33 14 33 34 0 36-48 64-58 72z"/>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#lpBg)"/>
  <rect width="512" height="512" rx="116" filter="url(#lpGrain)"/>

  <!-- coffee beans -->
  <g transform="rotate(-32 430 430)"><ellipse cx="430" cy="430" rx="16" ry="22" fill="#6E4535"/><path d="M430 410c-7 10 7 30 0 40" fill="none" stroke="#3F2A21" stroke-width="3" stroke-linecap="round"/></g>
  <g transform="rotate(24 458 392)"><ellipse cx="458" cy="392" rx="11" ry="15" fill="#86573F"/><path d="M458 379c-5 7 5 19 0 26" fill="none" stroke="#4A3026" stroke-width="2.5" stroke-linecap="round"/></g>

  <!-- saucer -->
  <circle cx="246" cy="270" r="182" fill="#8A6A58" opacity=".16" filter="url(#lpSoft)"/>
  <circle cx="240" cy="260" r="178" fill="url(#lpSaucer)"/>
  <circle cx="240" cy="260" r="140" fill="none" stroke="#E4D4C4" stroke-width="2"/>

  <!-- planner ring on the rim: done so far + dotted days still to come -->
  <circle cx="240" cy="260" r="162" fill="none" stroke="#CDB6A4" stroke-width="4" stroke-linecap="round" stroke-dasharray="0 14"/>
  <path d="M240 98a162 162 0 1 1-153.7 213.3" fill="none" stroke="url(#lpRose)" stroke-width="11" stroke-linecap="round"/>
  <path d="M86 311l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#B9776B"/>

  <!-- spoon -->
  <g transform="translate(26 18) rotate(48 118 386)"><rect x="112" y="330" width="12" height="76" rx="6" fill="url(#lpSpoon)"/><ellipse cx="118" cy="416" rx="16" ry="22" fill="url(#lpSpoon)"/><ellipse cx="114" cy="410" rx="5" ry="10" fill="#fff" opacity=".6"/></g>

  <!-- cup shadow, handle, cup -->
  <circle cx="252" cy="274" r="120" fill="#5B3F33" opacity=".22" filter="url(#lpSoft)"/>
  <g transform="rotate(28 240 260)"><rect x="344" y="240" width="82" height="42" rx="21" fill="url(#lpCup)" stroke="#3F2E27" stroke-width="7"/><rect x="362" y="253" width="46" height="16" rx="8" fill="#E9DCCD"/></g>
  <circle cx="240" cy="260" r="118" fill="url(#lpCup)" stroke="#3F2E27" stroke-width="7"/>
  <path d="M152 212a104 104 0 0 1 96-58" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".9"/>

  <!-- espresso with crema -->
  <circle cx="240" cy="260" r="95" fill="url(#lpEsp)"/>
  <circle cx="240" cy="260" r="90" fill="none" stroke="#B57E5C" stroke-width="9" opacity=".45" filter="url(#lpBlur2)"/>

  <!-- layered latte-art heart -->
  <g>
    <use href="#lpHeart" fill="#F6E8D8"/>
    <use href="#lpHeart" fill="#8A5A43" transform="translate(240 318) scale(.8) translate(-240 -318)"/>
    <use href="#lpHeart" fill="#F6E8D8" transform="translate(240 318) scale(.64) translate(-240 -318)"/>
    <use href="#lpHeart" fill="#8A5A43" transform="translate(240 318) scale(.47) translate(-240 -318)"/>
    <use href="#lpHeart" fill="#F6E8D8" transform="translate(240 318) scale(.32) translate(-240 -318)"/>
    <path d="M240 214C241 250 238 290 240 330" fill="none" stroke="#8A5A43" stroke-width="3.2" stroke-linecap="round"/>
  </g>

  <!-- a wisp of steam -->
  <g fill="none" stroke="#fff" stroke-linecap="round" opacity=".55" filter="url(#lpBlur2)">
    <path d="M300 170c30-26 6-54 34-78" stroke-width="7"/><path d="M322 186c26-22 8-44 30-62" stroke-width="5"/>
  </g>
</svg>
