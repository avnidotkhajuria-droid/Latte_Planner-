name: Morning paper
on:
  schedule:
    - cron: "11 1 * * *"   # 6:41 am India time, every day
  workflow_dispatch:        # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_news.py
      - name: Save today's paper
        run: |
          git config user.name "latte-bot"
          git config user.email "latte-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (git commit -m "Morning paper $(date -u +%F)" && git push)
