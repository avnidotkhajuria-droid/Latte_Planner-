<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LattePlanner</title>
<meta name="description" content="A cozy planner for college life">
<meta name="theme-color" content="#FAF5EE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LattePlanner">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,100;1,9..144,300..600,100&family=Nunito:wght@400;500;600;700;800&display=swap">
<style>
html{color-scheme:light;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

:root{
  color-scheme: light;
  --bg:#FAF5EE; --paper:#FFFDF9; --cream:#F6EEE3;
  --latte:#E9D8C4; --latte-2:#F3E8DA; --mocha:#9A7560; --coffee:#5B443A; --muted:#7C6A60; --faint:#A89789;
  --line:#EFE4D7;
  --pink:#E7BEB6; --pink-3:#C4827A; --pink-2:color-mix(in srgb,var(--pink) 36%,var(--paper));
  --sage:#B7C6AB; --sage-3:#6F875F; --sage-2:color-mix(in srgb,var(--sage) 34%,var(--paper));
  --taupe:#B5A597; --taupe-2:color-mix(in srgb,var(--taupe) 24%,var(--paper));
  --mauve:#C9AFBF; --mauve-2:color-mix(in srgb,var(--mauve) 28%,var(--paper));
  --warn:var(--warn); --accent-ink:var(--accent-ink); --btn:#5B443A; --on-btn:#FFF8F1; --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(110,80,60,.05),0 14px 34px -16px rgba(110,80,60,.24);
  --shadow-lift:0 2px 4px rgba(110,80,60,.06),0 22px 42px -18px rgba(110,80,60,.34);
  --r-lg:28px; --r-md:20px; --r-sm:14px;
  --display:'Fraunces','Iowan Old Style',Georgia,serif;
  --body:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;
  --hand:'Caveat','Segoe Print','Bradley Hand',cursive;
  --ease:cubic-bezier(.22,.8,.3,1);
}
html,body{height:100%}
body{background:var(--bg);color:var(--coffee);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--pink-3);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-variation-settings:"SOFT" 100;font-weight:450;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,3.2vw,38px);line-height:1.15}
h2{font-size:21px;line-height:1.25}
h3{font-size:17px;line-height:1.3}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
p{margin:0}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.sidebar{position:sticky;top:0;height:100vh;align-self:start;padding:22px 18px 16px;display:flex;flex-direction:column;gap:16px;background:var(--cream);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;padding:0 10px;font-family:var(--display);font-variation-settings:"SOFT" 100;font-size:19px;color:var(--mocha)}
.brand svg{color:var(--pink-3)}
.me{display:flex;align-items:center;gap:12px;padding:14px;background:var(--paper);border-radius:var(--r-md);box-shadow:var(--shadow);width:100%;text-align:left;transition:transform .3s var(--ease),box-shadow .3s}
.me:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.me.on{box-shadow:0 0 0 2px var(--pink),var(--shadow)}
.me .go{margin-left:auto;color:var(--faint)}
.avatar{overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.top-avatar{display:none}
.avatar{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-size:21px;color:var(--on-accent);background:radial-gradient(circle at 30% 25%,var(--pink),var(--pink-3) 78%);box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--pink-2)}
.me b{display:block;font-size:16px}
.me small{color:var(--muted);font-size:12.5px;line-height:1.35;display:block}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:16px;color:var(--muted);font-weight:600;text-align:left;transition:background .25s var(--ease),color .25s,transform .25s var(--ease)}
.nav button:hover{background:color-mix(in srgb,var(--paper) 70%,transparent);color:var(--coffee);transform:translateX(2px)}
.nav button.on{background:var(--paper);color:var(--coffee);box-shadow:var(--shadow)}
.nav button.on svg{color:var(--pink-3)}
.sip{margin-top:auto;padding:16px;border-radius:var(--r-md);background:var(--pink-2);display:flex;flex-direction:column;gap:10px}
.sip p{font-size:13px;color:var(--coffee)}
.cups{display:flex;gap:4px;flex-wrap:wrap}
.cups button{width:17px;height:24px;border-radius:4px 4px 8px 8px;border:1.5px solid var(--pink-3);transition:background .3s}
.cups button.f{background:var(--pink)}

main{min-width:0;padding:18px 36px 56px;display:flex;flex-direction:column;gap:26px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:14px;padding:10px 0;background:linear-gradient(var(--bg) 70%,transparent)}
.search{position:relative;flex:1;max-width:460px}
.search input{width:100%;height:46px;border-radius:999px;border:1px solid var(--line);background:var(--paper);padding:0 18px 0 44px;box-shadow:var(--shadow);outline:none;transition:border-color .2s,box-shadow .2s}
.search input:focus{border-color:var(--pink)}
.search input::placeholder{color:var(--faint)}
.search > svg{position:absolute;left:16px;top:14px;color:var(--faint)}
.results{position:absolute;top:54px;left:0;right:0;background:var(--paper);border-radius:var(--r-md);box-shadow:var(--shadow-lift);padding:8px;display:flex;flex-direction:column;max-height:360px;overflow:auto}
.results button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;text-align:left}
.results button:hover,.results button:focus-visible{background:var(--latte-2)}
.results small{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.results .none{padding:12px;color:var(--muted);font-size:14px}
.chip-info{display:flex;align-items:center;gap:8px;height:46px;padding:0 16px;border-radius:999px;background:var(--paper);box-shadow:var(--shadow);font-size:14px;white-space:nowrap}
.chip-info svg{color:var(--mocha)}
.chip-info b{font-weight:700}
.spacer{flex:1}
.fab{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--on-accent);background:linear-gradient(145deg,var(--pink),var(--pink-3));box-shadow:0 12px 24px -8px rgba(185,131,118,.7);transition:transform .3s var(--ease),box-shadow .3s}
.fab:hover{transform:translateY(-2px) rotate(90deg);box-shadow:0 16px 30px -10px rgba(185,131,118,.8)}

/* ---------- common ---------- */
.card{background:var(--paper);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:24px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.card-h .grow{flex:1}
.page{display:flex;flex-direction:column;gap:24px;animation:pagein .5s var(--ease)}
@keyframes pagein{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-head > div:first-child{flex:1;min-width:240px}
.page-head p{color:var(--muted);margin-top:6px;max-width:62ch}
.btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;font-weight:700;font-size:14px;transition:transform .25s var(--ease),background .25s,box-shadow .25s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--btn);color:var(--on-btn);box-shadow:0 10px 20px -10px rgba(91,68,58,.7)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.soft{background:var(--latte-2);color:var(--coffee)}
.btn.soft:hover{background:var(--latte)}
.btn.pink{background:var(--pink-2);color:var(--accent-ink)}
.btn.pink:hover{background:var(--pink)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.icon-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:background .2s,color .2s}
.icon-btn:hover{background:var(--latte-2);color:var(--coffee)}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--latte-2)}
.seg button{padding:7px 15px;border-radius:999px;font-size:13.5px;font-weight:700;color:var(--muted);transition:background .25s,color .25s,box-shadow .25s}
.seg button.on{background:var(--paper);color:var(--coffee);box-shadow:0 4px 10px -4px rgba(110,80,60,.3)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.tag i{width:7px;height:7px;border-radius:50%;display:inline-block}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.input,select.input,textarea.input{height:44px;border-radius:14px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-weight:500;color:var(--coffee);outline:none;transition:border-color .2s,background .2s;width:100%}
.input:focus{border-color:var(--pink);background:var(--paper)}
textarea.input{height:auto;padding:12px 14px;resize:vertical;line-height:1.6}

/* checkbox */
.chk{width:24px;height:24px;flex:none;border-radius:8px;border:1.7px solid var(--taupe);display:grid;place-items:center;color:var(--on-accent);background:var(--paper);transition:background .3s var(--ease),border-color .3s;position:relative}
.chk:hover{border-color:var(--pink-3)}
.chk svg{opacity:0;transform:scale(.4);transition:opacity .25s,transform .35s var(--ease)}
.chk.on{background:var(--sage-3);border-color:var(--sage-3);animation:pop .45s var(--ease)}
.chk.on svg{opacity:1;transform:none}
.chk.round{border-radius:50%}
.chk.on::after{content:"";position:absolute;inset:-6px;border-radius:inherit;border:2px solid var(--sage);animation:ripple .6s var(--ease) forwards;pointer-events:none}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes ripple{from{opacity:.9;transform:scale(.7)}to{opacity:0;transform:scale(1.35)}}
.done-text{transition:color .3s,opacity .3s}
.is-done .done-text{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--pink);text-decoration-thickness:1.5px}

/* ---------- dashboard ---------- */
.hello{display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
.hello > div{flex:1;min-width:260px}
.hello .quote{font-family:var(--display);font-style:italic;font-weight:350;color:var(--mocha);font-size:17px;margin-top:8px;max-width:58ch}
.glance{display:flex;flex-wrap:wrap;gap:10px}
.glance span{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--paper);box-shadow:var(--shadow);font-size:13.5px}
.glance span svg{color:var(--pink-3)}
.dash{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:24px;align-items:start}
.col{display:flex;flex-direction:column;gap:24px;min-width:0}
.intent{display:flex;flex-direction:column;gap:6px}
.intent-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;transition:background .25s}
.intent-row:hover{background:var(--bg)}
.intent-row .n{font-family:var(--display);color:var(--pink-3);font-size:15px;width:14px}
.intent-row input{flex:1;border:0;background:transparent;outline:none;font-size:15.5px;font-weight:600;min-width:0}
.intent-card{background:linear-gradient(160deg,var(--paper) 55%,var(--pink-2))}

.tl{display:flex;flex-direction:column;position:relative}
.tl::before{content:"";position:absolute;left:83px;top:14px;bottom:14px;width:2px;background:repeating-linear-gradient(var(--latte) 0 6px,transparent 6px 11px);border-radius:2px}
.tl-row{display:grid;grid-template-columns:68px 32px minmax(0,1fr);gap:0 0;align-items:start;padding:6px 0;position:relative}
.tl-time{font-size:12.5px;white-space:nowrap;color:var(--muted);font-weight:700;padding-top:14px;text-align:right;padding-right:6px}
.tl-dot{width:14px;height:14px;border-radius:50%;margin:16px auto 0;background:var(--paper);border:2px solid var(--taupe);position:relative;z-index:1}
.tl-row.now .tl-dot{border-color:var(--pink-3);background:var(--pink);box-shadow:0 0 0 5px var(--pink-2)}
.tl-row.past .tl-body{opacity:.7}
.tl-body{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:18px;transition:background .25s,transform .25s var(--ease)}
.tl-body.cls{background:var(--bg)}
.tl-body:hover{transform:translateX(2px)}
.tl-body .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none}
.tl-main{flex:1;min-width:0}
.tl-main b{font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl-main small{color:var(--muted);font-size:13px;display:block}
.att-chip{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px}
.present{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
.now-chip{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--on-accent);background:var(--pink-3);padding:2px 8px;border-radius:999px}
.allday{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}

.focus{background:linear-gradient(170deg,var(--paper) 40%,var(--latte-2))}
.focus-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.timer{display:grid;place-items:center;position:relative;margin:10px auto 6px;width:210px;max-width:100%;aspect-ratio:1}
.timer svg{position:absolute;inset:0;width:100%;height:100%}
.timer .t{font-family:var(--display);font-size:46px;font-weight:350;line-height:1;text-align:center}
.timer .p{display:block;text-align:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:8px}
.timer-ctrl{display:flex;justify-content:center;gap:10px;margin:8px 0 16px}
.play{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--btn);color:var(--on-btn);box-shadow:0 12px 22px -10px rgba(91,68,58,.8);transition:transform .25s var(--ease)}
.play:hover{transform:scale(1.05)}
.round-soft{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--latte-2);color:var(--mocha)}
.ambient{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:18px;background:var(--paper);border:1px solid var(--line)}
.amb-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:8px}
.amb-row .amb{padding:8px 11px;gap:7px;white-space:nowrap;min-width:0;font-size:13px;overflow:hidden}
.amb-row .amb svg{flex:none}
.amb-row .amb .eq{display:none}.amb-row .amb.on .eq{display:inline-flex}
.amb{justify-content:flex-start}
.amb .eq{margin-left:auto}
.amb{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-weight:700;font-size:13.5px;color:var(--muted);background:var(--paper);transition:all .3s var(--ease)}
.amb.on{background:var(--sage-2);border-color:var(--sage);color:var(--sage-3)}
.amb:active{transform:scale(.95)}
.amb.loading{animation:breathe 1.1s ease-in-out infinite}
.amb.loading .eq i{animation:none!important}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.55}}
.amb .eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.amb .eq i{width:2.5px;background:currentColor;border-radius:2px;height:4px}
.amb.on .eq i{animation:eq 1s ease-in-out infinite}
.amb.on .eq i:nth-child(2){animation-delay:.2s}.amb.on .eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
input[type=range]{accent-color:var(--pink-3);width:100%}
.vol{display:flex;align-items:center;gap:10px;color:var(--muted)}
.sessions{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-top:12px}
.sessions i{width:10px;height:10px;border-radius:50%;background:var(--latte)}
.sessions i.f{background:var(--pink-3)}

.upnext{display:flex;flex-direction:column;gap:4px}
.up-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px dashed var(--line)}
.up-row:last-child{border-bottom:0}
.up-row .d{width:46px;flex:none;text-align:center;border-radius:14px;background:var(--bg);padding:5px 0;line-height:1.1}
.up-row .d b{display:block;font-family:var(--display);font-size:19px;font-weight:450}
.up-row .d small{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.up-row .grow{flex:1;min-width:0}
.up-row .grow b{font-weight:600;font-size:14.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urg{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.urg.hot{background:var(--pink-2);color:var(--warn)}
.urg.warm{background:var(--latte-2);color:var(--mocha)}
.urg.calm{background:var(--sage-2);color:var(--sage-3)}

/* ---------- calendar ---------- */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:24px;align-items:start}
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-dow{text-align:center;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:4px 0 8px}
.day{aspect-ratio:1/0.92;min-height:62px;border-radius:18px;padding:8px 9px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;background:var(--bg);transition:background .25s,transform .25s var(--ease),box-shadow .25s;position:relative}
.day:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.day .dn{font-weight:700;font-size:14px}
.day.out{background:transparent;color:var(--faint)}
.day.hol{background:var(--sage-2)}
.day.bday{background:var(--pink-2)}
.day.today .dn{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--btn);color:var(--on-btn);margin:-3px 0 0 -4px}
.day.sel{box-shadow:0 0 0 2px var(--pink-3)}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%}
.day .lbl{font-size:11px;line-height:1.2;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%}
.dayp-list{display:flex;flex-direction:column;gap:10px}
.dayp-item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px}
.dayp-item .ic{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--paper)}
.empty{padding:22px;border-radius:18px;border:1.5px dashed var(--latte);text-align:center;color:var(--muted);font-size:14px}
.tasks{display:flex;flex-direction:column}
.task{display:flex;align-items:center;gap:14px;padding:14px 8px;border-bottom:1px solid var(--line);transition:opacity .35s,background .25s;border-radius:12px}
.task:hover{background:var(--bg)}
.task:last-child{border-bottom:0}
.task .grow{flex:1;min-width:0}
.task .grow b{font-weight:600;display:block}
.task .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;align-items:center}
.task.is-done{opacity:.6}
.task-edit{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;flex:1;align-items:center}
.addrow{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:10px;margin-bottom:10px}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- routines ---------- */
.flow-head{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.bar{height:10px;border-radius:999px;background:var(--latte-2);overflow:hidden;flex:1;min-width:160px}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--pink),var(--sage));transition:width .6s var(--ease)}
.flow{position:relative;display:flex;flex-direction:column;gap:30px;padding-left:0}
.flow::before{content:"";position:absolute;left:100px;top:10px;bottom:10px;width:3px;border-radius:3px;background:linear-gradient(var(--pink),var(--sage) 50%,var(--latte))}
.block-h{display:grid;grid-template-columns:78px 48px minmax(0,1fr);align-items:center;margin-bottom:8px}
.block-h .badge{grid-column:2;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;margin:0 auto;position:relative;z-index:1;box-shadow:0 0 0 6px var(--bg)}
.block-h .txt{padding-left:14px}
.block-h .txt small{display:block;color:var(--muted);font-size:13px}
.step{display:grid;grid-template-columns:78px 48px minmax(0,1fr);align-items:center;padding:5px 0}
.step .st{font-size:12.5px;white-space:nowrap;font-weight:700;color:var(--muted);text-align:right;padding-right:10px}
.step .sd{width:34px;height:34px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:var(--paper);border:2px solid var(--line);position:relative;z-index:1;color:var(--mocha);transition:all .35s var(--ease)}
.step.done .sd{background:var(--sage-2);border-color:var(--sage);color:var(--sage-3)}
.step-card{display:flex;align-items:center;gap:14px;margin-left:12px;padding:13px 16px;border-radius:18px;background:var(--paper);box-shadow:var(--shadow);transition:transform .3s var(--ease),opacity .3s}
.step-card:hover{transform:translateX(3px)}
.step-card .grow{flex:1;min-width:0}
.step-card b{font-weight:700;display:block}
.step-card small{color:var(--muted);font-size:12.5px}
.step.done .step-card{opacity:.72}
.nowline{display:grid;grid-template-columns:78px 48px minmax(0,1fr);align-items:center;margin:2px 0}
.nowline span{font-size:11px;font-weight:800;color:var(--pink-3);text-align:right;padding-right:10px;letter-spacing:.06em}
.nowline i{width:12px;height:12px;border-radius:50%;background:var(--pink-3);margin:0 auto;box-shadow:0 0 0 5px var(--pink-2);position:relative;z-index:1}
.nowline em{height:2px;background:linear-gradient(90deg,var(--pink-3),transparent);margin-left:12px}
.swipe{position:relative;width:138px;height:40px;border-radius:999px;background:var(--latte-2);flex:none;touch-action:none;user-select:none;overflow:hidden;transition:background .35s}
.swipe .fill{position:absolute;inset:0;border-radius:inherit;background:var(--sage-2);transform-origin:left;transition:transform .35s var(--ease)}
.swipe .lbl{position:absolute;inset:0;display:grid;place-items:center;padding-left:32px;font-size:12px;font-weight:700;color:var(--muted);pointer-events:none}
.swipe .knob{position:absolute;top:4px;left:4px;width:32px;height:32px;border-radius:50%;background:var(--paper);box-shadow:0 3px 8px rgba(110,80,60,.25);display:grid;place-items:center;color:var(--mocha);transition:transform .35s var(--ease),background .3s,color .3s}
.swipe.dragging .knob,.swipe.dragging .fill{transition:none}
.swipe.on .knob{background:var(--sage-3);color:var(--on-accent)}
.swipe.on .lbl{padding-left:0;padding-right:34px;color:var(--sage-3)}

/* ---------- academics ---------- */
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.ring{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:18px 12px;border-radius:22px;background:var(--bg)}
.ring svg{width:108px;height:108px}
.ring b{font-weight:700;font-size:14px;line-height:1.3}
.ring small{font-size:12px;color:var(--muted)}
.table-wrap{overflow-x:auto;margin:0 -8px}
table{width:100%;border-collapse:separate;border-spacing:0 6px;min-width:620px;padding:0 8px}
th{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:left;font-weight:800;padding:4px 14px}
td{padding:13px 14px;background:var(--bg);font-size:14px}
td:first-child{border-radius:14px 0 0 14px}
td:last-child{border-radius:0 14px 14px 0}
tr.hot td{background:var(--pink-2)}
.hubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.hub{display:flex;flex-direction:column;gap:18px}
.hub-h{display:flex;gap:12px;align-items:center}
.hub-h .ini{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-family:var(--display);font-size:19px;flex:none}
.hub-h small{display:block;color:var(--muted);font-size:12.5px}
.sub{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.unit{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:14px}
.mini-bar{height:6px;border-radius:999px;background:var(--latte-2);overflow:hidden;margin-bottom:10px}
.mini-bar i{display:block;height:100%;border-radius:inherit;transition:width .5s var(--ease)}
.nb-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.nb{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:12px;background:var(--bg);font-size:13px;font-weight:600;transition:background .2s}
.nb:hover{background:var(--latte-2)}
.create-nb{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:18px;border-radius:20px;border:1.5px dashed var(--pink);background:repeating-linear-gradient(135deg,var(--pink-2) 0 12px,color-mix(in srgb,var(--pink-2) 50%,var(--paper)) 12px 24px);color:var(--accent-ink);font-weight:800;font-size:14.5px;transition:transform .3s var(--ease),box-shadow .3s,border-color .3s}
.create-nb:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--pink-3)}
.create-nb span{width:30px;height:30px;border-radius:50%;background:var(--paper);display:grid;place-items:center;color:var(--pink-3)}

/* ---------- finance ---------- */
.fin{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:start}
.donut{position:relative;width:min(100%,440px);aspect-ratio:1;margin:0 auto}
.donut svg{position:absolute;left:16%;top:16%;width:68%;height:68%}
.donut .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.donut .center b{font-family:var(--display);font-size:clamp(26px,4vw,36px);font-weight:400;display:block;line-height:1.1}
.donut .center small{font-size:12.5px;color:var(--muted)}
.bub{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;animation:float 5s ease-in-out infinite}
.bub:nth-of-type(2){animation-delay:-1.2s}.bub:nth-of-type(3){animation-delay:-2.4s}.bub:nth-of-type(4){animation-delay:-3.6s}
.bub .b{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--paper);box-shadow:var(--shadow);border:2px solid transparent;transition:transform .3s var(--ease),border-color .3s}
.bub:hover .b{transform:scale(1.08)}
.bub.on .b{border-color:currentColor}
.bub small{font-size:12px;font-weight:800;color:var(--coffee)}
.bub em{font-style:normal;font-size:11.5px;color:var(--muted);margin-top:-4px}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -6px}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{padding:14px;border-radius:18px;background:var(--bg)}
.stat small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.stat b{font-family:var(--display);font-size:22px;font-weight:420}
.cat-bars{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.cat-bar{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.cat-bar .mini-bar{margin:4px 0 0}
.add-exp{width:100%;justify-content:center;height:54px;font-size:15px;margin-top:20px}
.txn{display:flex;align-items:center;gap:14px;padding:13px 8px;border-bottom:1px solid var(--line)}
.txn:last-child{border-bottom:0}
.txn .ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none}
.txn .grow{flex:1;min-width:0}
.txn .grow b{font-weight:600;display:block}
.txn .amt{font-weight:800}

/* ---------- journal ---------- */
.entry{background:var(--paper);border-radius:32px;box-shadow:var(--shadow);padding:28px;position:relative;overflow:hidden}
.entry::before{content:"";position:absolute;inset:0 0 86px 0;background:repeating-linear-gradient(transparent 0 33px,var(--line) 33px 34px);background-position:0 96px;pointer-events:none}
.entry > *{position:relative}
.entry textarea{width:100%;min-height:210px;border:0;background:transparent;outline:none;resize:vertical;font-family:var(--display);font-size:19px;line-height:34px;font-weight:350;color:var(--coffee)}
.entry textarea::placeholder{color:var(--faint);font-style:italic}
.entry-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.tool{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:13.5px;font-weight:700;color:var(--muted);transition:all .25s var(--ease)}
.tool:hover{background:var(--latte-2);color:var(--coffee)}
.tool.set{background:var(--pink-2);border-color:var(--pink);color:var(--accent-ink)}
.moods{display:flex;gap:8px;flex-wrap:wrap;padding:12px;border-radius:18px;background:var(--bg);margin-top:10px}
.mood{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;background:var(--paper);border:1px solid var(--line)}
.mood i{width:10px;height:10px;border-radius:50%}
.mood.on{border-color:var(--coffee)}
.attach{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.attach img{height:84px;width:auto;border-radius:12px;box-shadow:var(--shadow)}
.file-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;background:var(--latte-2);font-size:12.5px;font-weight:600}
.archive{columns:3 260px;column-gap:24px}
.arch-item{break-inside:avoid;margin-bottom:26px;position:relative;transition:transform .35s var(--ease)}
.arch-item:hover{transform:rotate(0deg) translateY(-3px)!important}
.arch-item .x{position:absolute;top:8px;right:8px;opacity:0;transition:opacity .2s;background:var(--paper);z-index:2}
.arch-item:hover .x,.arch-item:focus-within .x{opacity:1}
.polaroid{background:var(--paper);padding:12px 12px 18px;border-radius:6px;box-shadow:0 2px 3px rgba(110,80,60,.08),0 16px 30px -16px rgba(110,80,60,.35)}
.polaroid .ph{aspect-ratio:4/3;border-radius:3px;overflow:hidden;background:var(--latte-2)}
.polaroid .ph img,.polaroid .ph svg{width:100%;height:100%;object-fit:cover;display:block}
.polaroid .cap{font-family:var(--hand);font-size:21px;line-height:1.25;margin-top:12px;color:var(--coffee)}
.polaroid .foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
.notecard{background:var(--paper);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.notecard p{font-family:var(--display);font-weight:350;font-size:16px;line-height:1.55}
.sticky{padding:26px 20px 22px;border-radius:6px 6px 22px 6px;box-shadow:0 14px 26px -16px rgba(110,80,60,.4);position:relative}
.sticky::before{content:"";position:absolute;top:-9px;left:50%;width:70px;height:20px;margin-left:-35px;background:rgba(255,253,249,.65);border-radius:3px;transform:rotate(-3deg)}
.sticky p{font-family:var(--hand);font-size:23px;line-height:1.2}
.sticky small{display:block;margin-top:10px;font-size:12px;color:var(--muted)}
.dump-add{display:flex;gap:10px;flex:1;min-width:240px;max-width:460px}

/* ---------- settings ---------- */
.set-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.set-grid .card{display:flex;flex-direction:column;gap:14px}
.range-row{display:flex;align-items:center;gap:12px}
.range-row b{min-width:48px;text-align:right}

/* ---------- modal & toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(91,68,58,.22);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;z-index:60;animation:fade .25s}
.modal{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--paper);border-radius:30px;box-shadow:var(--shadow-lift);padding:26px;display:flex;flex-direction:column;gap:16px;animation:rise .35s var(--ease)}
.modal.wide{width:min(760px,100%)}
.modal-h{display:flex;align-items:center;gap:10px}
.modal-h h2{flex:1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat-pick{display:flex;gap:8px;flex-wrap:wrap}
.cat-pick button{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;font-weight:700;color:var(--muted);transition:all .2s}
.cat-pick button.on{background:var(--latte-2);border-color:var(--mocha);color:var(--coffee)}
.nb-paper{min-height:320px;background:repeating-linear-gradient(var(--paper) 0 31px,var(--line) 31px 32px);line-height:32px;padding:0 14px;border-radius:14px;border:1px solid var(--line)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--on-btn);padding:12px 20px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:var(--shadow-lift);z-index:70;animation:rise .35s var(--ease);display:flex;gap:8px;align-items:center;white-space:nowrap}
.toast svg{color:var(--pink)}
.mobile-nav{display:none}
.nav{overflow-y:auto;min-height:0;flex:1;padding-right:2px}
.nav button{padding:8px 14px}
.nav-label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:800;padding:12px 14px 4px}
.nav-label:first-child{padding-top:0}
.mark{display:flex;flex-direction:column;align-items:center;gap:4px}
.absent{font-size:10.5px;font-weight:800;color:var(--faint);padding:2px 6px;border-radius:999px;transition:all .2s}
.absent:hover{color:var(--warn)}
.absent.on{background:var(--pink-2);color:var(--warn)}
.banner{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:18px 22px;border-radius:var(--r-lg);background:linear-gradient(120deg,var(--pink-2),var(--sage-2));box-shadow:var(--shadow)}
.banner .grow{flex:1;min-width:220px}
.banner b{font-family:var(--display);font-weight:450;font-size:19px;display:block}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{padding:9px 16px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);background:var(--paper);border:1px solid var(--line);transition:all .2s}
.tabs button.on{background:var(--coffee);color:var(--paper);border-color:var(--coffee)}
.edit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr));gap:12px}
.edit-grid .full{grid-column:1/-1}
.color-pick{display:flex;gap:6px;flex-wrap:wrap}
.color-pick button{width:28px;height:28px;border-radius:50%;box-shadow:0 0 0 2px var(--paper);transition:transform .2s}
.color-pick button.on{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--coffee);transform:scale(1.05)}
.row-edit{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:12px;border-radius:18px;background:var(--bg)}
.row-edit > *{flex:1 1 130px;min-width:0}
.row-edit > button,.row-edit > span:last-child{flex:0 0 auto}
.list-gap{display:flex;flex-direction:column;gap:10px}
.input.mini{height:38px;width:72px;padding:0 10px;text-align:center}
.card-note{font-size:13px;color:var(--muted)}
.check-row{display:flex;align-items:center;gap:12px;padding:8px 0;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--latte-2);color:var(--mocha);white-space:nowrap}
td .pill{white-space:normal;line-height:1.35}
.pill.warn{background:var(--pink-2);color:var(--warn)}
.pill.ok{background:var(--sage-2);color:var(--sage-3)}
.grade{display:inline-grid;place-items:center;min-width:40px;height:30px;padding:0 8px;border-radius:10px;font-family:var(--display);font-size:16px;font-weight:500;background:var(--latte-2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:22px;align-items:start}
.day-plan{display:flex;flex-direction:column;gap:6px}
.plan-day{padding:14px 16px;border-radius:18px;background:var(--bg)}
.plan-day.exam{background:var(--pink-2)}
.plan-day h3{display:flex;align-items:center;gap:8px;font-size:16px;margin-bottom:6px;flex-wrap:wrap}
.plan-item{display:flex;align-items:flex-start;gap:10px;padding:7px 0}
.plan-item .grow{flex:1;min-width:0}
.plan-item b{font-weight:600;display:block;font-size:14.5px}
.plan-item small{color:var(--muted);font-size:12.5px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:4px;overflow-x:auto;padding-bottom:4px}
.heat i{width:14px;height:14px;border-radius:4px;background:var(--latte-2)}
.big-num{font-family:var(--display);font-size:40px;font-weight:400;line-height:1}
.glass{width:90px;height:120px;border-radius:10px 10px 22px 22px;border:3px solid var(--sage);position:relative;overflow:hidden;flex:none;background:var(--paper)}
.glass i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(var(--sage),var(--sage-3));transition:height .6s var(--ease);opacity:.85}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:4px}
.strip span{height:44px;border-radius:10px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);position:relative}
.strip span.per{background:var(--pink);color:var(--on-accent)}
.strip span.pred{background:transparent;border:1.5px dashed var(--pink-3);color:var(--pink-3)}
.strip span.fert{background:var(--sage-2)}
.strip span.today{box-shadow:0 0 0 2px var(--coffee)}
.strip small{font-size:9px;font-weight:800;opacity:.8}
.menu-table{min-width:760px}
.menu-table td{vertical-align:top;cursor:pointer;min-width:100px}
.menu-table td.today,.menu-table th.today{background:var(--pink-2)}
.menu-table td textarea{width:100%;min-height:70px;border:1px solid var(--pink);border-radius:10px;padding:6px;background:var(--paper);font:inherit;font-size:13px;resize:vertical}
.meal{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:18px;background:var(--bg)}
.meal.now{background:var(--pink-2)}
.meal .grow{flex:1;min-width:0}
.meal b{display:block;font-weight:700}
.rate{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.rate button{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--paper)}
.rate button.on{background:var(--coffee);color:var(--paper);border-color:var(--coffee)}
.proj{display:flex;flex-direction:column;gap:10px}
.proj .top{display:flex;gap:10px;align-items:flex-start}
.proj .top .grow{flex:1;min-width:0}
.stack{display:flex;gap:6px;flex-wrap:wrap}
.stack span{font-size:12px;font-weight:700;padding:3px 9px;border-radius:8px;background:var(--latte-2);color:var(--mocha)}
.dots5{display:inline-flex;gap:4px}
.dots5 button{width:14px;height:14px;border-radius:50%;background:var(--latte-2);border:1.5px solid var(--taupe)}
.dots5 button.on{background:var(--pink-3);border-color:var(--pink-3)}
.skill{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.skill:last-child{border-bottom:0}
.hearts{display:inline-flex;gap:4px}
.hearts button{color:var(--latte)}
.hearts button.on{color:var(--pink-3)}
.refl textarea{min-height:90px}
@media (max-width:900px){
  .mobile-nav{overflow-x:auto;justify-content:flex-start;gap:4px;scrollbar-width:none}
  .mobile-nav button{flex:none}
}

/* ---------- appearance ---------- */
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 10px 8px;border-radius:18px;border:1.5px solid var(--line);background:var(--bg);font-size:12.5px;font-weight:700;color:var(--muted);min-width:76px;transition:border-color .2s,transform .25s var(--ease)}
.swatch:hover{transform:translateY(-2px)}
.swatch.on{border-color:var(--coffee);color:var(--coffee)}
.swatch .dots3{display:flex}
.swatch .dots3 i{width:20px;height:20px;border-radius:50%;margin-left:-6px;box-shadow:0 0 0 2px var(--paper)}
.swatch .dots3 i:first-child{margin-left:0}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600}
.switch{width:46px;height:26px;border-radius:999px;background:var(--latte);position:relative;flex:none;transition:background .25s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--paper);box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .3s var(--ease)}
.switch.on{background:var(--sage-3)}
.switch.on::after{transform:translateX(20px)}
.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:90}

/* ---------- daily to-dos ---------- */
.todo-add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.todo-add .input{flex:1;min-width:180px;border-radius:999px}
.chip-toggle{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:700;color:var(--muted);transition:all .2s}
.chip-toggle.on{background:var(--pink-2);border-color:var(--pink-3);color:var(--accent-ink)}
.todo{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:16px;transition:background .25s,opacity .3s}
.todo:hover{background:var(--bg)}
.todo .grow{flex:1;min-width:0}
.todo .grow span{font-weight:600;display:block}
.todo .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.todo.is-done{opacity:.6}
.todo .del{opacity:0;transition:opacity .2s}
.todo:hover .del,.todo:focus-within .del{opacity:1}
.carry{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--latte-2);color:var(--mocha)}
.due{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--pink-2);color:var(--warn)}
.missed{margin-top:12px;padding:12px 14px;border-radius:18px;border:1.5px dashed var(--pink);display:flex;flex-direction:column;gap:8px}
.missed-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.missed-row span{flex:1;min-width:160px}
.rule{font-size:12.5px;color:var(--muted);margin-top:10px;display:flex;gap:6px;align-items:flex-start}

/* ---------- news ---------- */
.paper-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:2px solid var(--coffee)}
.paper-head h1{font-size:clamp(34px,5vw,52px);font-weight:500;letter-spacing:-.02em}
.paper-head .ed{font-size:12.5px;color:var(--muted);text-align:right;margin-left:auto}
.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:22px}
.news-sec h2{display:flex;align-items:center;gap:8px;font-size:19px;margin-bottom:6px}
.story{display:block;padding:14px 0;border-bottom:1px dashed var(--line);color:inherit;text-decoration:none}
.story:last-child{border-bottom:0}
.story b{font-family:var(--display);font-weight:450;font-size:17px;line-height:1.3;display:block;transition:color .2s}
.story:hover b{color:var(--pink-3)}
.story p{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.5}
.story small{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--mocha);margin-top:6px}
.lead{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.lead b{font-size:24px}
.src-links{display:flex;flex-wrap:wrap;gap:8px}
.src-links a{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--coffee);text-decoration:none;font-size:13.5px;font-weight:700}
.src-links a:hover{background:var(--latte-2)}
.news-mini a{display:block;padding:9px 0;border-bottom:1px dashed var(--line);text-decoration:none;color:inherit}
.news-mini a:last-child{border-bottom:0}
.news-mini b{font-weight:600;font-size:14.5px;display:block;line-height:1.35}
.news-mini small{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}

/* ---------- mood mix ---------- */
.mix-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:24px;align-items:start}
.mood-pick{display:flex;flex-wrap:wrap;gap:8px}
.mood-pick button{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-weight:700;font-size:14px;color:var(--muted);transition:all .2s}
.mood-pick button i{width:11px;height:11px;border-radius:50%}
.mood-pick button.on{border-color:var(--coffee);color:var(--coffee);background:var(--latte-2)}
.vinyl{width:84px;height:84px;border-radius:50%;flex:none;background:radial-gradient(circle,var(--pink) 0 17%,var(--coffee) 18% 21%,#2b2320 22% 100%);box-shadow:inset 0 0 0 6px rgba(255,255,255,.04),inset 0 0 0 14px rgba(255,255,255,.03),var(--shadow)}
.vinyl.spin{animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mix-head{display:flex;gap:18px;align-items:center;margin-bottom:12px}
.song{display:flex;align-items:center;gap:12px;padding:11px 8px;border-bottom:1px solid var(--line);border-radius:10px}
.song:hover{background:var(--bg)}
.song:last-child{border-bottom:0}
.song .n{width:22px;text-align:right;color:var(--faint);font-weight:800;font-size:13px}
.song .grow{flex:1;min-width:0}
.song b{font-weight:700;display:block}
.song small{color:var(--muted);font-size:12.5px;display:block}
.song small.desc{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;opacity:.85}
.res-tile{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--coffee)}
.sp{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:#1DB954;color:#0b1f12;font-weight:800;font-size:12.5px;text-decoration:none;white-space:nowrap}
.sp:hover{filter:brightness(1.08)}
.connect{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:18px;background:var(--sage-2)}
.connect .ic{width:40px;height:40px;border-radius:50%;background:#1DB954;color:#0b1f12;display:grid;place-items:center;flex:none}
.think{display:flex;gap:10px;align-items:center;color:var(--muted);font-weight:600}
.dots-anim i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--pink-3);margin:0 2px;animation:bob 1s infinite ease-in-out}
.dots-anim i:nth-child(2){animation-delay:.15s}.dots-anim i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-5px);opacity:1}}
@media (max-width:1180px){.mix-wrap{grid-template-columns:minmax(0,1fr)}}

/* ---------- routine editing ---------- */
.rep{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--sage-3);background:var(--sage-2);padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:2px;text-decoration:none}
.step.off .step-card{opacity:.55;box-shadow:none;border:1.5px dashed var(--latte)}
.step.off .sd{border-style:dashed}
.step-card.editable{cursor:pointer}
.step-card.editable:hover{box-shadow:0 0 0 2px var(--pink),var(--shadow)}
.edit-hint{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--latte-2);color:var(--mocha);flex:none}
.add-step{grid-column:3;margin-left:12px;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px;border-radius:18px;border:1.5px dashed var(--pink);color:var(--accent-ink);font-weight:800;font-size:14px;background:color-mix(in srgb,var(--pink-2) 45%,transparent);transition:background .25s,transform .25s var(--ease)}
.add-step:hover{background:var(--pink-2);transform:translateY(-1px)}
.weekly{display:flex;flex-direction:column;gap:10px}
.weekly-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:var(--bg);flex-wrap:wrap}
.weekly-row .ic{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:var(--paper);color:var(--mocha);flex:none}
.weekly-row .grow{flex:1;min-width:160px}
.weekly-row .grow b{font-weight:700;display:block}
.weekly-row small{color:var(--muted);font-size:12.5px}
.wk-days{display:flex;gap:4px}
.wk-days i{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-style:normal;font-weight:800;background:var(--paper);color:var(--faint)}
.wk-days i.on{background:var(--sage-2);color:var(--sage-3)}
.wk-days i.today{box-shadow:inset 0 0 0 1.5px var(--pink-3)}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.daypick button{min-width:48px;height:40px;padding:0 10px;border-radius:14px;border:1px solid var(--line);font-weight:800;font-size:13px;color:var(--muted);background:var(--paper);transition:all .2s}
.daypick button.on{background:var(--pink-2);border-color:var(--pink-3);color:var(--accent-ink)}
.iconpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.iconpick button{height:42px;border-radius:12px;display:grid;place-items:center;background:var(--bg);color:var(--mocha);border:1.5px solid transparent;transition:all .2s}
.iconpick button.on{border-color:var(--mocha);background:var(--latte-2)}
.presets{display:flex;gap:8px;flex-wrap:wrap}
.form-err{color:var(--warn);font-weight:700;font-size:13.5px}

/* ---------- profile ---------- */
.prof-hero{display:flex;gap:30px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,var(--paper) 45%,var(--pink-2));padding:32px}
.big-av{position:relative;flex:none}
.avatar.big{width:132px;height:132px;font-size:56px;box-shadow:0 0 0 6px var(--paper),0 0 0 9px var(--pink-2)}
.cam{position:absolute;right:2px;bottom:4px;width:42px;height:42px;border-radius:50%;background:var(--btn);color:var(--on-btn);display:grid;place-items:center;box-shadow:0 8px 18px -8px rgba(91,68,58,.8);transition:transform .25s var(--ease)}
.cam:hover{transform:scale(1.08)}
.prof-main{flex:1;min-width:260px}
.prof-main .quote{font-family:var(--display);font-style:italic;font-weight:350;color:var(--mocha);font-size:17px;margin-top:6px}
.prof-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.prof-chips span{display:inline-flex;gap:7px;align-items:center;padding:7px 13px;border-radius:999px;background:var(--paper);font-size:13px;font-weight:600;box-shadow:0 2px 6px -3px rgba(110,80,60,.2)}
.prof-chips svg{color:var(--pink-3)}
.prof-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.prof-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.prof-form .full{grid-column:1/-1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.kpi{padding:18px 20px;border-radius:22px;background:var(--paper);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px}
.kpi small{font-size:12.5px;font-weight:700;color:var(--muted)}
.kpi b{font-family:var(--display);font-size:30px;font-weight:400;line-height:1.2}
.kpi em{font-style:normal;font-size:12.5px;color:var(--muted)}
.kpi em.warn{color:var(--warn);font-weight:700}
.summary ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.summary li{display:flex;gap:12px;align-items:flex-start;font-size:15px;max-width:75ch}
.summary li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pink);margin-top:8px;flex:none}
.report{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:22px}
.vbars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;height:180px;align-items:stretch}
.vbar{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.vbar .colm{flex:1;width:100%;max-width:34px;border-radius:12px;background:var(--latte-2);display:flex;align-items:flex-end;overflow:hidden}
.vbar .colm i{display:block;width:100%;border-radius:12px;transition:height .7s var(--ease)}
.vbar small{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}
.vbar b{font-size:12px;font-weight:800}
.caption{font-size:12.5px;color:var(--muted);margin-top:12px}
.hbar{display:grid;grid-template-columns:96px minmax(0,1fr) 44px;gap:12px;align-items:center;font-size:13.5px;padding:6px 0}
.hbar > span:first-child{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .track{height:10px;border-radius:999px;background:var(--latte-2);position:relative}
.hbar .track i{position:absolute;left:0;top:0;bottom:0;border-radius:inherit;transition:width .7s var(--ease)}
.hbar .track em{position:absolute;top:-5px;bottom:-5px;width:2px;border-radius:2px;background:var(--coffee);opacity:.35}
.hbar b{text-align:right;font-weight:800}
.mood-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .dash,.cal-wrap,.fin{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{display:none}
  main{padding:10px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .mobile-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line)}
  .mobile-nav button{width:40px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--muted)}
  .mobile-nav button.on{background:var(--pink-2);color:var(--pink-3)}
  .chip-info.time{display:none}
  .top-avatar{display:block;flex:none}
  .top-avatar .avatar{width:44px;height:44px;font-size:19px;box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--pink-2)}
  .spacer{display:none}
  .search{min-width:0}
}
@media (max-width:620px){
  .chip-info.wx span{display:none}
  .chip-info{padding:0 13px}
  .card{padding:18px;border-radius:24px}
  .tl::before{left:65px}
  .tl-row{grid-template-columns:52px 28px minmax(0,1fr)}
  .tl-time{font-size:11px;padding-right:4px}
  .intent-row input{font-size:14.5px}
  .tl-body{padding:10px 12px;gap:10px}
  .tl-body .ic{display:none}
  .flow::before{left:74px}
  .block-h,.step,.nowline{grid-template-columns:52px 44px minmax(0,1fr)}
  .step-card{flex-wrap:wrap;margin-left:8px}
  .add-step{margin-left:8px}
  .prof-hero{padding:22px;gap:20px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .kpi b{font-size:26px}
  .hbar{grid-template-columns:78px minmax(0,1fr) 40px}
  .swipe{width:100%}
  .addrow,.task-edit,.row2{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:minmax(0,1fr)}
  .day{min-height:44px;border-radius:12px;padding:5px}
  .day .lbl{display:none}
  .cal-grid{gap:4px}
}

/* ---------- welcome ---------- */
.boot-blank{min-height:100vh;background:var(--bg)}
.welcome{min-height:100vh;display:grid;place-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));background:radial-gradient(circle at 15% 8%,var(--pink-2),transparent 42%),radial-gradient(circle at 85% 92%,var(--sage-2),transparent 45%),var(--bg);transition:background .4s}
.w-card{width:min(600px,100%);background:var(--paper);border-radius:34px;box-shadow:var(--shadow-lift);padding:30px 28px 24px;display:flex;flex-direction:column;gap:20px;overflow:hidden;animation:rise .5s var(--ease)}
.w-progress{display:flex;gap:6px}
.w-progress i{flex:1;height:6px;border-radius:99px;background:var(--latte-2);transition:background .4s}
.w-progress i.done{background:var(--sage-3)}.w-progress i.on{background:var(--pink-3)}
.w-body{display:flex;flex-direction:column;gap:16px}
.w-body.fwd{animation:wIn .45s var(--ease)}.w-body.back{animation:wBack .45s var(--ease)}
@keyframes wIn{from{opacity:0;transform:translateX(28px)}}@keyframes wBack{from{opacity:0;transform:translateX(-28px)}}
.w-q{display:flex;flex-direction:column;gap:14px}
.w-q h2{font-family:var(--display);font-weight:450;font-size:clamp(24px,5vw,30px);line-height:1.15}
.w-hello{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.w-hello h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,7vw,44px);line-height:1.05}
.w-hello p.muted{max-width:440px}
.w-cup{width:150px;height:auto;margin-bottom:4px;animation:wFloat 4s ease-in-out infinite}
.w-steam path{animation:wSteam 2.4s ease-in-out infinite;opacity:.8}
.w-steam path:nth-child(2){animation-delay:.4s}.w-steam path:nth-child(3){animation-delay:.8s}
@keyframes wSteam{0%{transform:translateY(6px);opacity:0}40%{opacity:.8}100%{transform:translateY(-8px);opacity:0}}
@keyframes wFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.w-big{height:54px;font-size:19px}
.w-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.w-span{grid-column:1/-1}
@media (max-width:520px){.w-grid{grid-template-columns:1fr}.w-card{padding:24px 18px 18px;border-radius:28px}.w-foot .btn{padding:0 13px;font-size:13.5px}.w-foot .w-skip{padding:0 8px}.w-go{height:46px}}
.w-chips{display:flex;flex-wrap:wrap;gap:8px}
.w-chips .chip-toggle{height:40px;animation:rise .35s var(--ease) both}
.w-add{display:flex;gap:8px}
.w-stepper{display:flex;align-items:center;gap:12px;color:var(--coffee)}
.w-stepper .round-soft{width:40px;height:40px}
.w-stepper b{font-size:26px;font-family:var(--display);font-weight:450;min-width:28px;text-align:center}
.w-foot{display:flex;gap:8px;align-items:center}
.w-skip{color:var(--muted);background:transparent}
.w-skip:hover{background:var(--latte-2)}
.w-go{height:50px;padding:0 24px;font-size:15px}
.w-link{color:var(--pink-3);font-weight:800;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.w-sum{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:10px;text-align:left}
.w-sum li{display:flex;gap:10px;align-items:flex-start;font-weight:600;color:var(--coffee);animation:rise .4s var(--ease) both}
.w-sum li:nth-child(2){animation-delay:.08s}.w-sum li:nth-child(3){animation-delay:.16s}.w-sum li:nth-child(4){animation-delay:.24s}
.w-sum li svg{color:var(--sage-3);flex:none;margin-top:2px}

/* ---------- opening animation ---------- */
.intro{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow:hidden;cursor:pointer}
.intro-stage{width:min(620px,96vw);height:auto;overflow:visible;transform-origin:72.5% 63.3%;margin-top:-8vh}
.intro.zoom .intro-stage{animation:iZoom .75s cubic-bezier(.65,0,.35,1) forwards}
@keyframes iZoom{55%{opacity:1}to{transform:scale(40);opacity:0}}
.intro.out{animation:iOut .6s ease forwards}
@keyframes iOut{to{opacity:0;visibility:hidden}}
.i-cupin{animation:iCupIn .45s cubic-bezier(.3,1.4,.5,1) both}
@keyframes iCupIn{from{transform:translateY(-26px);opacity:0}}
.i-cup{transform-box:view-box;transform-origin:174px 168px;animation:iTip .55s cubic-bezier(.55,0,.55,1.25) .4s both}
@keyframes iTip{to{transform:rotate(95deg)}}
.i-surface{animation:iHide .15s .5s forwards}
.i-steam{animation:iHide .2s .38s forwards}
.i-steam path{animation:wSteam 1.2s ease-in-out infinite}
@keyframes iHide{to{opacity:0}}
.i-pour{transform-box:fill-box;transform-origin:0 0;transform:scale(1,0);animation:iPour .85s ease-out .62s forwards}
@keyframes iPour{0%{transform:scale(1,0)}30%{transform:scale(1,1)}100%{transform:scale(.25,1)}}
.i-blob{transform-box:fill-box;transform-origin:0 50%;transform:scale(0);animation:iBlob .75s cubic-bezier(.2,.8,.3,1) forwards}
.b5{animation-delay:.7s}.b1{animation-delay:.76s}.b3{animation-delay:.84s}.b2{animation-delay:.92s}.b4{animation-delay:1.02s}
@keyframes iBlob{from{transform:scale(0,.3)}to{transform:scale(1)}}
.i-drop{opacity:0;animation:iDrop .55s cubic-bezier(.3,.6,.5,1) forwards}
@keyframes iDrop{0%{opacity:1;transform:translate(0,0)}55%{transform:translate(var(--dx),var(--dy))}100%{opacity:1;transform:translate(calc(var(--dx) * 1.35),4px) scale(.5)}}
.i-crema{opacity:0;animation:iIn .5s 1.1s forwards}
@keyframes iIn{to{opacity:1}}
.i-heart{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:iHeart .55s cubic-bezier(.3,1.6,.5,1) 1.18s forwards}
@keyframes iHeart{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1)}}
.i-shadow{opacity:0;animation:iIn .6s .8s forwards}
.intro-word{display:flex;flex-direction:column;align-items:center;gap:2px;opacity:0;animation:iWord .6s var(--ease) .95s forwards;margin-top:-4vh}
.intro-word b{font-family:var(--display);font-weight:450;font-size:clamp(30px,6vw,40px);color:var(--coffee)}
.intro-word span{font-family:var(--hand,'Caveat',cursive);font-size:22px;color:var(--mocha)}
@keyframes iWord{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.intro.zoom .intro-word{opacity:1;animation:iHide .25s forwards}
.intro-skip{position:absolute;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));padding:8px 16px;border-radius:999px;background:var(--latte-2);color:var(--mocha);font-weight:700;font-size:13px;opacity:.8}
.app.revealing{animation:appZoom .8s cubic-bezier(.2,.8,.3,1)}
@keyframes appZoom{from{transform:scale(1.08);filter:blur(8px);opacity:.2}}

/* ---------- little motion everywhere ---------- */
.page>*,.dash .col>*,.grid2>*{animation:cardIn .55s var(--ease) both}
.page>*:nth-child(2),.dash .col>*:nth-child(2),.grid2>*:nth-child(2){animation-delay:.05s}
.page>*:nth-child(3),.dash .col>*:nth-child(3),.grid2>*:nth-child(3){animation-delay:.1s}
.page>*:nth-child(4),.dash .col>*:nth-child(4),.grid2>*:nth-child(4){animation-delay:.15s}
.page>*:nth-child(5),.dash .col>*:nth-child(5),.grid2>*:nth-child(5){animation-delay:.2s}
.page>*:nth-child(n+6),.dash .col>*:nth-child(n+6),.grid2>*:nth-child(n+6){animation-delay:.25s}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}}
.card{transition:box-shadow .3s var(--ease),transform .3s var(--ease)}
.btn:active,.icon-btn:active,.round-soft:active,.play:active{transform:scale(.94)}
.play{transition:transform .2s var(--ease)}
.timer.running .t{animation:tick 2s ease-in-out infinite}
@keyframes tick{0%,100%{opacity:1}50%{opacity:.82}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
.boot{min-height:100vh;display:grid;place-items:center;font-family:var(--display);color:var(--mocha);font-size:20px}

.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(circle at 20% 10%,var(--pink-2),transparent 45%),radial-gradient(circle at 80% 90%,var(--sage-2),transparent 45%),var(--bg)}
.login-card{width:min(420px,100%);background:var(--paper);border-radius:32px;box-shadow:var(--shadow-lift);padding:32px 26px;display:flex;flex-direction:column;gap:16px}
.img-ph{width:100%;aspect-ratio:4/3;background:var(--latte-2);border-radius:6px}
img.res-tile{object-fit:cover}
</style>
</head>
<body>
<div id="root"><div class="boot">Brewing your planner…</div></div>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="app.js"></script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</body>
</html>
